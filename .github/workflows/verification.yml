name: Vérification des gestes et de la sauvegarde
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe
        run: |
          node --check servir.mjs
          for fichier in app/*.js; do node --check "$fichier" || exit; done
      - run: npm run test:persistance
      - run: npm run test:manuel
      - run: npm run test:marches
      - run: npm run test:provenances
