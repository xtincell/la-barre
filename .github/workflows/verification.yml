name: Vérification des gestes et de la sauvegarde
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe
        run: |
          node --check servir.mjs
          for fichier in app/*.js; do node --check "$fichier" || exit; done
      - run: npm run test:persistance
      - run: npm run test:manuel
      - run: npm run test:marches
      - run: npm run test:provenances
      - run: npm run test:decisions
      - run: npm run test:bilan
      - run: node outils/distribuer-approches.mjs --check
      - run: node --test tests/approches.test.mjs
      - run: node --test tests/entreprise.test.mjs
  image-entreprise:
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Préparer la distribution neutre du commit
        run: node outils/distribuer-entreprise.mjs "$RUNNER_TEMP/barre-entreprise" "$(git rev-parse HEAD)"
      - name: Construire et recevoir le poste sans corpus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/barre-entreprise/sources" "$RUNNER_TEMP/barre-entreprise/extraits" "$RUNNER_TEMP/barre-entreprise/depots"
          printf 'PRIVATE_COMPANY_PROBE' > "$RUNNER_TEMP/barre-entreprise/sources/private-probe.txt"
          printf 'PRIVATE_COMPANY_PROBE' > "$RUNNER_TEMP/barre-entreprise/extraits/private-probe.txt"
          printf '{"private":true}' > "$RUNNER_TEMP/barre-entreprise/depots/private-probe.json"
          docker build -t la-barre-entreprise:receipt "$RUNNER_TEMP/barre-entreprise"
          docker run -d --name barre-entreprise-receipt -p 127.0.0.1:5174:3000 \
            -v receipt-company-depots:/app/depots -v receipt-company-review:/app/assets/review la-barre-entreprise:receipt
          trap 'docker rm -f barre-entreprise-receipt >/dev/null' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:5174/depots/manifeste.json >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:5174';
          const manifest=await(await fetch(base+'/depots/manifeste.json')).json();
          const data=await(await fetch(base+'/depots/'+manifest.reference)).json();
          assert.equal(data.maison,'Entreprise');assert.equal(data.schema,5);
          for(const value of Object.values(data))if(Array.isArray(value))assert.equal(value.length,0);
          assert.match(await(await fetch(base+'/app/amorce.js')).text(),/disponible: false/);
          assert.doesNotMatch(await(await fetch(base+'/app/maison.js')).text(),/MATANGA|P-alex|MT-0020/);
          for(const name of ['/sources/private-probe.txt','/extraits/private-probe.txt','/depots/private-probe.json'])assert.equal((await fetch(base+name)).status,404);
          const read=await fetch(base+'/depots/'+manifest.reference);
          data.projets.push({id:'OWNED-COMPANY-PROJECT',nom:'Travail reçu',sections:{}});
          const write=await fetch(base+'/depots/'+manifest.reference,{method:'PUT',headers:{'Content-Type':'application/json','If-Match':read.headers.get('etag')},body:JSON.stringify(data)});
          assert.equal(write.status,200);
          JS
          docker restart barre-entreprise-receipt
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:5174/depots/entreprise.json | grep -q OWNED-COMPANY-PROJECT; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5174/depots/entreprise.json | grep -q OWNED-COMPANY-PROJECT
  image:
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer des témoins privés exclus du contexte
        run: |
          mkdir -p depots assets/review
          printf '{"privateBuildProbe":true}' > depots/private-build-probe.json
          printf 'private-media-probe' > assets/review/private-build-probe.png
          printf 'PRIVATE_BUILD_PROBE=1\n' > .env.production
      - name: Construire et exercer la vraie image
        run: |
          set -euo pipefail
          docker build -t la-barre:receipt .
          docker run -d --name la-barre-receipt -p 127.0.0.1:5173:3000 \
            -v receipt-depots:/app/depots -v receipt-review:/app/assets/review la-barre:receipt
          trap 'docker rm -f la-barre-receipt >/dev/null' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:5173';
          const page=await fetch(base+'/');
          assert.equal(page.status,200);assert.match(await page.text(),/La Barre/i);
          assert.match(page.headers.get('x-la-barre-runtime'),/^[a-f0-9]{64}$/);
          for(const path of ['/depots/private-build-probe.json','/assets/review/private-build-probe.png','/.env.production']) {
            assert.equal((await fetch(base+path)).status,404,path);
          }
          const body=JSON.stringify({enregistre_le:'2026-10-16T00:00:00Z',projets:[{id:'RECEIPT-ONLY'}]});
          const write=await fetch(base+'/depots/receipt.json',{method:'PUT',headers:{'If-None-Match':'*','Content-Type':'application/json'},body});
          assert.equal(write.status,200);
          const read=await fetch(base+'/depots/receipt.json');assert.equal(await read.text(),body);
          const stale=await fetch(base+'/depots/receipt.json',{method:'PUT',headers:{'If-Match':'"stale"','Content-Type':'application/json'},body:JSON.stringify({projets:[]})});
          assert.equal(stale.status,409);
          assert.equal(await (await fetch(base+'/depots/receipt.json')).text(),body);
          const media=await fetch(base+'/assets/review/receipt.png',{method:'PUT',body:'data:image/png;base64,cHJvYmU='});
          assert.equal(media.status,200);assert.equal(await (await fetch(base+'/assets/review/receipt.png')).text(),'probe');
          const packetPath='/assets/review/partage/'+'a'.repeat(24)+'.json';
          const packet=JSON.stringify({schema:1,projectId:'RECEIPT-ONLY',doc:'cadrage',html:'<h1>Document reçu</h1>'});
          const packetWrite=await fetch(base+packetPath,{method:'PUT',headers:{'If-None-Match':'*','Content-Type':'application/json'},body:packet});
          assert.equal(packetWrite.status,200);
          const packetRead=await fetch(base+packetPath);assert.ok(packetRead.headers.get('etag'));assert.equal(await packetRead.text(),packet);
          assert.equal((await fetch(base+packetPath,{method:'PUT',headers:{'If-Match':'"stale"'},body:'{}'})).status,409);
          assert.equal((await fetch(base+'/assets/review/partage/other.json',{method:'PUT',body:'{}'})).status,403);
          JS
          docker restart la-barre-receipt
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5173/depots/receipt.json | grep -q RECEIPT-ONLY; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/depots/receipt.json | grep -q RECEIPT-ONLY
          curl -fsS http://127.0.0.1:5173/assets/review/partage/aaaaaaaaaaaaaaaaaaaaaaaa.json | grep -q RECEIPT-ONLY
          for i in $(seq 1 25); do
            if [ "$(docker inspect la-barre-receipt --format '{{.State.Health.Status}}')" = healthy ]; then break; fi
            sleep 1
          done
          test "$(docker inspect la-barre-receipt --format '{{.State.Health.Status}}')" = healthy
          docker image inspect la-barre:receipt --format 'Image bytes: {{.Size}}'
